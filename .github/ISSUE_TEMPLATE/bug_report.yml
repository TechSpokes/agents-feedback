name: Bug report
description: Report a reproducible problem with agents-feedback.
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: "Use this form for reproducible, non-sensitive bugs. Do not include secrets, credentials, private logs, customer data, private issue text, screenshots, large logs, or private tokens."
  - type: input
    id: version
    attributes:
      label: Version
      description: The agents-feedback version or commit.
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and sanitized evidence.
    validations:
      required: true
